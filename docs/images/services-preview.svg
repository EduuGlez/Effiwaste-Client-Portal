      <circle cx="312" cy="-8" r="88" fill="#6bac00" opacity="0.04"/>
      <rect x="24" y="24" width="58" height="58" rx="15" fill="#eef7df"/>
      <path d="M40 66h27M43 66V49a11 11 0 0 1 21 0v17M38 49h31M49 36c0-5 9-5 9 0" fill="none" stroke="#578900" stroke-width="2.4" stroke-linecap="round"/>
