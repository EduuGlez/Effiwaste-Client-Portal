      <line x1="24" y1="345" x2="318" y2="345" stroke="#e4edf3"/>
      <text x="24" y="381" fill="#0b5394" font-size="12" font-weight="700">Acceder al servicio</text>
      <text x="293" y="383" fill="#00b6bd" font-size="23">→</text>
